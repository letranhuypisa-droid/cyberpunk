<!doctype html>
<meta charset="utf-8">
<title>Glassjaw idle — thử sprite sheet 720p</title>
<style>
  :root{ --bg:#0d0b11; --line:#2a2533; --txt:#c8c2d4; --dim:#6f6880; --acc:#57e0d0; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;padding:20px}
  h1{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);
    font-weight:700;margin:0 0 18px}
  .row{display:flex;gap:28px;align-items:flex-end;flex-wrap:wrap}
  .cell{border:1px solid var(--line);padding:14px 16px 10px;background:#131019}
  .cap{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
    margin-top:10px;text-align:center}
  .cap b{color:var(--acc);font-weight:700}
  /* Khung sprite: đúng tỉ lệ 1 frame (406x662) */
  .sp{position:relative;aspect-ratio:406/662;
      background-image:url(../../art/sprite/glassjaw_idle.webp);
      background-repeat:no-repeat;
      /* sheet 5 cột x 4 hàng -> phóng nền lên 500% x 400% */
      background-size:500% 400%;
      image-rendering:auto}
  .ground{position:absolute;left:50%;bottom:-4px;width:62%;height:12px;
    transform:translateX(-50%);
    background:radial-gradient(ellipse at center,rgba(0,0,0,.75),transparent 68%)}
  /* Ba cỡ: nhỏ nhất trong game / lớn nhất trong game / soi 2x */
  .w84 .sp{width:84px}  .w160 .sp{width:160px}  .w320 .sp{width:320px}
  .ctl{margin-top:22px;display:flex;gap:18px;align-items:center;font-size:12px}
  label{color:var(--dim)}
  input[type=range]{width:150px;vertical-align:middle}
  .val{color:var(--acc);min-width:52px;display:inline-block}
  .note{margin-top:20px;max-width:760px;color:var(--dim);font-size:12px;line-height:1.7}
  .note b{color:var(--txt)}
</style>

<h1>Glassjaw idle — sprite sheet 720p · 20 frame · ping-pong</h1>

<div class="row">
  <div class="cell w84">
    <div class="sp" data-sp><div class="ground"></div></div>
    <div class="cap">84px<br>cỡ nhỏ nhất</div>
  </div>
  <div class="cell w160">
    <div class="sp" data-sp><div class="ground"></div></div>
    <div class="cap"><b>160px</b><br>cỡ thật trong trận</div>
  </div>
  <div class="cell w320">
    <div class="sp" data-sp><div class="ground"></div></div>
    <div class="cap">320px<br>soi 2x (= retina)</div>
  </div>
</div>

<div class="ctl">
  <label>fps <input type="range" id="fps" min="6" max="24" step="1" value="12">
    <span class="val" id="fpsv">12</span></label>
  <label><input type="checkbox" id="pp" checked> ping-pong (xuôi rồi ngược)</label>
</div>

<div class="note">
  Sheet: <b>2030×2648</b> (5×4), mỗi frame <b>406×662</b>, file <b>451 KB</b> WebP có nền trong suốt.<br>
  Lấy từ đoạn frame 28–66 của clip 720p — đoạn lặp mượt nhất trong 4 giây.
</div>

<script>
  const COLS = 5, ROWS = 4, N = 20;
  const els = [...document.querySelectorAll('[data-sp]')];
  const fpsEl = document.getElementById('fps');
  const fpsV  = document.getElementById('fpsv');
  const ppEl  = document.getElementById('pp');

  let fps = 12, pingpong = true, i = 0, dir = 1, last = 0;

  function draw(){
    const col = i % COLS, row = (i / COLS) | 0;
    // với background-size 500%x400%, mỗi bước là 100/(COLS-1) và 100/(ROWS-1) phần trăm
    const x = COLS > 1 ? col * 100 / (COLS - 1) : 0;
    const y = ROWS > 1 ? row * 100 / (ROWS - 1) : 0;
    const pos = x + '% ' + y + '%';
    for (const el of els) el.style.backgroundPosition = pos;
  }

  function tick(t){
    if (t - last >= 1000 / fps){
      last = t;
      if (pingpong){
        i += dir;
        if (i >= N - 1){ i = N - 1; dir = -1; }
        else if (i <= 0){ i = 0; dir = 1; }
      } else {
        i = (i + 1) % N;
      }
      draw();
    }
    requestAnimationFrame(tick);
  }

  fpsEl.oninput = () => { fps = +fpsEl.value; fpsV.textContent = fps; };
  ppEl.onchange = () => { pingpong = ppEl.checked; dir = 1; };
  draw();
  requestAnimationFrame(tick);
</script>
